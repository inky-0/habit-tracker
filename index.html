<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Habit Tracker</h1>
  </header>

  <main>
    <!-- Auth screen (register / log in) -->
    <section id="auth-view" class="card">
      <div class="tabs">
        <button id="show-login" class="tab active" type="button">Log in</button>
        <button id="show-register" class="tab" type="button">Register</button>
      </div>

      <form id="login-form">
        <label>Username <input id="login-username" required autocomplete="username"></label>
        <label>Password <input id="login-password" type="password" required autocomplete="current-password"></label>
        <button type="submit" class="primary">Log in</button>
      </form>

      <form id="register-form" hidden>
        <label>Username <input id="register-username" required autocomplete="username"></label>
        <label>Email <input id="register-email" type="email" required autocomplete="email"></label>
        <label>Password <input id="register-password" type="password" required minlength="6" autocomplete="new-password"></label>
        <button type="submit" class="primary">Create account</button>
      </form>

      <p id="auth-error" class="error" hidden></p>
    </section>

    <!-- Habits screen (shown after log in) -->
    <section id="habits-view" hidden>
      <div class="topbar">
        <p>Logged in as <strong id="current-username"></strong></p>
        <button id="logout-button" type="button">Log out</button>
      </div>

      <form id="habit-form" class="card">
        <h2>Add a habit</h2>
        <input id="habit-name" placeholder="Habit name (e.g. Drink water)" required>
        <input id="habit-notes" placeholder="Notes (optional)">
        <button type="submit" class="primary">Add habit</button>
      </form>

      <p id="empty-message" class="empty" hidden>No habits yet. Add your first one above.</p>
      <ul id="habit-list"></ul>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/parse/5.3.0/parse.min.js"></script>
  <script src="config.js"></script>
  <script src="habits.js"></script>
  <script src="app.js"></script>
</body>
</html>
